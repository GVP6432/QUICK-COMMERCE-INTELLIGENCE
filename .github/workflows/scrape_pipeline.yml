name: Data Pipeline CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: quick_commerce_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Load sample data
        env:
          DATA_PATH: data/sample/sample_combined.json
          DB_HOST: localhost
          DB_PASSWORD: testpassword
          DB_NAME: quick_commerce_db
        run: python scripts/load_to_db.py

      - name: Run SQL transformations
        env:
          DB_HOST: localhost
          DB_PASSWORD: testpassword
          DB_NAME: quick_commerce_db
        run: python scripts/run_sql_transforms.py